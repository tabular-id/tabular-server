[package]
name = "tabular-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tabular-server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
hyper = { version = "1", features = ["full"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
futures = "0.3"
futures-util = "0.3"

# Database — MySQL
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-native-tls",
    "mysql",
    "chrono",
    "uuid",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth — JWT
jsonwebtoken = "9"

# Password hashing (for admin / service accounts)
argon2 = "0.5"

# OAuth HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# CRDT — yrs (Yjs port for Rust)
yrs = "0.21"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
once_cell = "1"

# Crypto
aes-gcm = "0.10"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
