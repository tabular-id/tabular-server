name: tabular-server-stack

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tabular-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8420}:8420"
    environment:
      - DATABASE_URL=mysql://tabular_user:tabular_password@db:3306/tabular_server
      - SERVER_PORT=8420
      - SERVER_BASE_URL=${SERVER_BASE_URL:-http://localhost:8420}
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-long-random-secret-in-production}
      - JWT_ACCESS_EXPIRY_MINUTES=${JWT_ACCESS_EXPIRY_MINUTES:-60}
      - JWT_REFRESH_EXPIRY_DAYS=${JWT_REFRESH_EXPIRY_DAYS:-30}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8420/api/v1/auth/callback/google}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8420/api/v1/auth/callback/github}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8420}
    env_file:
      - .env
